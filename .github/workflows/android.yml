name: Build Android APK

# Builds a signed debug APK (shared repo keystore → one stable SHA-1, matches
# the Android OAuth client you create once in Google Cloud). Tap "Run workflow"
# in GitHub → Actions, then download the APK artifact.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also publish the APK as a GitHub Release asset'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to publish under (when publishing)'
        type: string
        default: 'v0.1.0'
  push:
    branches: [main, master, 'arena/**']
    paths: ['src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'capacitor.config.json', 'android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_AVAILABLE: ${{ secrets.KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS deps
        run: npm ci || npm install

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor → android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # github runners ship a full Android SDK ($ANDROID_HOME); locate sdkmanager
      # robustly (PATH varies between runner images) + force-download fallback
      - name: Prepare Android SDK (preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKMAN=$(command -v sdkmanager || true)
          [ -n "$SDKMAN" ] || SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then
            echo "sdkmanager not found — downloading cmdline-tools"
            curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d /tmp/ct
            SDKMAN=/tmp/ct/cmdline-tools/bin/sdkmanager
          fi
          echo "using: $SDKMAN"
          yes | "$SDKMAN" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMAN" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
            sudo "$SDKMAN" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Show signing SHA-1 (this is what your Google Cloud "Android OAuth client" must contain)
        run: |
          echo "package: com.bitscol.personalcrm"
          keytool -list -v -keystore android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:"

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-crm-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── optional signed release build, only when keystore secrets exist ──
      - name: Decode release keystore (if secret present)
        if: env.KEYSTORE_AVAILABLE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Assemble release APK (only with signing secrets)
        if: env.KEYSTORE_AVAILABLE == 'true'
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK
        if: env.KEYSTORE_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: personal-crm-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── publish the APK as a GitHub Release asset ──
      # Two ways to trigger:
      #   • Actions → "Build Android APK" → Run workflow → tick "publish_release"
      #   • a commit whose message starts with `release: <tag>` (e.g. `release: v0.1.0`)
      - name: Publish APK to GitHub Release
        if: >-
          (github.event_name == 'workflow_dispatch' && format('{0}', inputs.publish_release) == 'true') ||
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e   # bookkeeping must not fail the build; verified explicitly at the end
          VER="$(node -p "require('./package.json').version")"
          TAG="v$VER"
          if [ "${{ github.event_name }}" = "push" ]; then
            MSG_TAG="$(printf '%s' "${{ github.event.head_commit.message }}" | head -1 | sed -E 's/^release:[[:space:]]*//; s/[[:space:]].*$//')"
            [ -n "$MSG_TAG" ] && TAG="$MSG_TAG"
          else
            [ -n "${{ inputs.release_tag }}" ] && TAG="${{ inputs.release_tag }}"
          fi
          # keytool -v prints "SHA1: …"; non-verbose prints "Certificate fingerprint (SHA-1): …"
          SHA1="$(keytool -list -v -keystore android/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep -iE 'SHA-?1\)?:' | head -1 | sed -E 's/.*SHA-?1\)?:[[:space:]]*//')"
          echo "tag=$TAG version=$VER sha1=${SHA1:-<none>}"
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/personal-crm-${TAG}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-assets/personal-crm-${TAG}-release.apk"
          fi
          {
            echo "### Personal CRM ${VER} (${TAG})"
            echo
            echo "Fully client-side personal CRM: contacts, Keep-class notes, tasks & calendar, files with nearby transfer, knowledge base, real reminders. Works offline; installable as a PWA."
            echo
            echo "- **Live PWA:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "- **APK:** debug build below (install over the previous one — same debug keystore, so upgrades work). Android 7+."
            echo "- **Signing SHA-1** (use this for the Google Cloud *Android OAuth client*, package \`com.bitscol.personalcrm\`): \`${SHA1:-see the 'Show signing SHA-1' step of this run}\`"
            echo
            echo "Built from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
          } > /tmp/notes.md
          # run_cmd <label> <cmd…> — capture output + exit code, surface failures as annotations
          run_cmd() {
            local label="$1"; shift
            local out code
            out="$("$@" 2>&1)"; code=$?
            echo "--- [$label] exit=$code"
            [ -n "$out" ] && printf '%s\n' "$out"
            [ "$code" -ne 0 ] && echo "::warning::$label failed (exit $code): $(printf '%s' "$out" | head -c 500 | tr '\n' ' ')"
            return 0
          }
          asset_id() { gh release view "$TAG" --json assets --jq ".assets[] | select(.name==\"personal-crm-${TAG}-debug.apk\") | .id" 2>/dev/null | head -1; }
          BEFORE_ID="$(asset_id)"
          echo "asset id before: ${BEFORE_ID:-<none>}"
          if [ -n "$BEFORE_ID" ]; then
            # Releases in this repo are IMMUTABLE: assets can neither be replaced (--clobber
            # → HTTP 422 "Cannot delete asset from an immutable release") nor added.
            # Notes edits are still allowed, so refresh those and leave the APK alone.
            echo "release $TAG already carries the APK (id $BEFORE_ID) and is immutable → refreshing notes only"
            run_cmd "release edit" gh release edit "$TAG" --title "Personal CRM ${VER} (${TAG})" --notes-file /tmp/notes.md
            echo "::notice::Release $TAG is immutable and already has personal-crm-${TAG}-debug.apk — bump package.json version (or commit 'release: <new-tag>') to publish a new build."
          else
            echo "creating release $TAG"
            run_cmd "release create" gh release create "$TAG" release-assets/*.apk --target "$GITHUB_SHA" --title "Personal CRM ${VER} (${TAG})" --notes-file /tmp/notes.md --latest
          fi
          AFTER_ID="$(asset_id)"
          echo "asset id after: ${AFTER_ID:-<none>}"
          gh release view "$TAG" --json tagName,assets --jq '{tag:.tagName,assets:[.assets[]|{name:.name,size:.size,id:.id}]}' 2>&1
          # ── verification: the release must carry the APK asset ──
          if [ -z "$AFTER_ID" ]; then
            echo "::error::APK asset missing from release $TAG"
            exit 1
          fi
          echo "verified: APK asset present on $TAG (id $AFTER_ID)"
