name: Probes

# Every push to the working branches runs the Phase 0/1 probe suite against the
# production build. A red X here means the build is not honest/safe/responsive.
on:
  push:
    branches: [main, phase0]
    paths: ['src/**', 'package.json', 'package-lock.json', 'probe-*.mjs', 'scripts/**', 'vite.config.*', 'index.html', '.github/workflows/probes.yml']
  pull_request:
    branches: [main, phase0]
  workflow_dispatch:

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run probe suite
        run: npm run test:probes:ci
